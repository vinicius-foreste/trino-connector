[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trino_connector"
version = "0.1.0"
description = "Utilities to connect and diagnose Trino (DataShare)"
authors = [{name = "Vinicius Foreste"}]
dependencies = [
  "requests==2.31.0",
  "python-dotenv==1.0.0",
  "pyhive==0.6.0",
  "keyring==23.13.1",
  "pandas==2.1.3",
  "chromadb>=0.5.0",
]
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
markers = ["integration: mark tests that require access to a live Trino instance"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]
src = ["src"]

[project.scripts]
trino-connector = "trino_connector.cli:main"
