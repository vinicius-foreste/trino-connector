[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trino_connector"
version = "0.1.0"
description = "Utilities to connect and diagnose Trino (DataShare)"
authors = [{name = "Vinicius Foreste"}]
dependencies = [
  "requests==2.31.0",
  "python-dotenv==1.2.2",
  "pyhive==0.6.0",
  "keyring==23.13.1",
  "pandas==2.1.3",
]
license = "MIT"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
markers = ["integration: mark tests that require access to a live Trino instance"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]

[project.scripts]
trino-connector = "cli:main"
